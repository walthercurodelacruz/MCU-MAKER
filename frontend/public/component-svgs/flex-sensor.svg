<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 142" width="40" height="142">
  <defs>
    <linearGradient id="fsBase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="fsSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Flexible Substrate Strip -->
  <rect x="10" y="8" width="20" height="114" rx="4" fill="url(#fsBase)" stroke="#0284c7" stroke-width="1.2"/>

  <!-- Conductive Carbon / Ink Segments -->
  <rect x="13" y="16" width="14" height="6" rx="1" fill="#475569" stroke="#94a3b8" stroke-width="0.6"/>
  <rect x="13" y="27" width="14" height="6" rx="1" fill="#475569" stroke="#94a3b8" stroke-width="0.6"/>
  <rect x="13" y="38" width="14" height="6" rx="1" fill="#475569" stroke="#94a3b8" stroke-width="0.6"/>
  <rect x="13" y="49" width="14" height="6" rx="1" fill="#475569" stroke="#94a3b8" stroke-width="0.6"/>
  <rect x="13" y="60" width="14" height="6" rx="1" fill="#475569" stroke="#94a3b8" stroke-width="0.6"/>
  <rect x="13" y="71" width="14" height="6" rx="1" fill="#475569" stroke="#94a3b8" stroke-width="0.6"/>
  <rect x="13" y="82" width="14" height="6" rx="1" fill="#475569" stroke="#94a3b8" stroke-width="0.6"/>
  <rect x="13" y="93" width="14" height="6" rx="1" fill="#475569" stroke="#94a3b8" stroke-width="0.6"/>

  <!-- Indicator -->
  <text x="20" y="112" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#38bdf8" text-anchor="middle">FLEX</text>

  <!-- Base Stiffener -->
  <rect x="8" y="116" width="24" height="10" rx="2" fill="#0f172a" stroke="#475569" stroke-width="1"/>

  <!-- Solder Pins -->
  <line x1="14" y1="126" x2="14" y2="136" stroke="url(#fsSilver)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="26" y1="126" x2="26" y2="136" stroke="url(#fsSilver)" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="14" cy="136" r="1.6" fill="#38bdf8"/>
  <circle cx="26" cy="136" r="1.6" fill="#38bdf8"/>
</svg>
