name: CI Multiplataforma (Linux & Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-check-and-test:
    name: Rust Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"

      - name: Cargo Check
        run: |
          cd rust
          cargo check --workspace

      - name: Cargo Clippy
        run: |
          cd rust
          cargo clippy --workspace

      - name: Fetch Linux QEMU Runtime (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/download-qemu-runtime.sh
          ./scripts/download-qemu-runtime.sh

      - name: Cargo Test
        run: |
          cd rust
          cargo test --workspace

  frontend-build:
    name: Frontend Build & Assets (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build Web SPA
        run: |
          cd frontend
          npm run build:docker

  package-linux:
    name: Linux Installer Package (.deb)
    runs-on: ubuntu-24.04
    needs: [rust-check-and-test, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust & Node
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev dpkg-dev curl

      - name: Build Official .deb Package
        run: |
          chmod +x build-installer.sh
          ./build-installer.sh

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcu-maker-linux-deb
          path: dist-installer/*.deb
